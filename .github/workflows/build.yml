name: Build desktop apps

# Two ways to run this:
#   1. Actions tab -> "Build desktop apps" -> "Run workflow"   (no code, no tag)
#   2. Push a tag starting with v -> also publishes a Release
on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build for macOS (slower, not needed for Windows users)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install xarray pandas numpy dask pytest
      - run: pytest -q

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install psutil pyinstaller

      - name: Show environment
        run: nektone-cli doctor

      - name: Freeze
        run: pyinstaller packaging/nektone.spec --noconfirm --clean

      - name: Verify the build produced an executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/NekTone/NekTone.exe")) {
            Write-Error "NekTone.exe was not produced - check the Freeze step above."
            exit 1
          }
          $size = (Get-ChildItem dist/NekTone -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Build OK - {0:N0} MB" -f $size)

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/NekTone -DestinationPath NekTone-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NekTone-windows
          path: NekTone-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NekTone-windows.zip
          generate_release_notes: true

  macos:
    name: macOS
    needs: test
    # Only when explicitly requested, or on a tagged release.
    if: inputs.build_macos || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    continue-on-error: true   # a macOS failure must never hide a good Windows build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install psutil pyinstaller

      - name: Freeze
        run: pyinstaller packaging/nektone.spec --noconfirm --clean

      - name: Package
        run: ditto -c -k --keepParent dist/NekTone NekTone-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NekTone-macos
          path: NekTone-macos.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NekTone-macos.zip
